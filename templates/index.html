{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body">
        <h1 class="h4 mb-3">Välj en stad</h1>
        <form action="{{ url_for('forecast') }}" method="get">
            <div class="mb-3">
                <label for="city" class="form-label">Stad</label>
                <select name="city" id="city" class="form-select">
                    {% for city in cities %}
                        <option value="{{ city }}">{{ city }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Visa väderprognos</button>
        </form>
    </div>
</div>
{% endblock %}
