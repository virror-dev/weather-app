<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Väderappen</title>
    <!-- Bootstrap CSS för layout, navigering och formulär) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Väderappen</a>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto py-3 bg-white border-top text-center text-muted">
        <div class="container">
            <small>
                Väderdata från <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a> (CC BY 4.0)
            </small>
        </div>
    </footer>
</body>
</html>
